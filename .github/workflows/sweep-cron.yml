name: Frequent evaluation sweep (Vercel Hobby cron workaround)

# Vercel's Hobby plan only allows daily-scheduled Vercel Crons, so
# sweep-evaluations and queue-alert are configured in vercel.json to run
# once a day. Without something running them more often, a stuck evaluation
# (the immediate post-enqueue trigger crashed or timed out mid-run) sits in
# PROCESSING for up to 24 hours before the daily cron reclaims it — during
# active testing this was observed firsthand. GitHub Actions' schedule
# trigger has no such daily-only restriction, so it fills that gap for free.
#
# CRON_SECRET must be set as a GitHub Actions repo secret with the exact
# same value as the CRON_SECRET env var on Vercel (Settings > Environment
# Variables, Production). Both cron routes fail closed (401) when the
# secret is unset or doesn't match — see src/app/api/cron/*/route.ts — so a
# missing/mismatched secret on either side breaks every run. There is no
# unauthenticated fallback; do not remove the header.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep due/stuck evaluation jobs
        run: |
          url="${{ vars.PRODUCTION_URL || 'https://get-ahead-five.vercel.app' }}/api/cron/sweep-evaluations"
          http_code=$(curl -s -o /tmp/sweep-body.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$url")
          echo "GET $url -> HTTP $http_code"
          echo "Response body:"
          cat /tmp/sweep-body.txt
          echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::sweep-evaluations returned HTTP $http_code (expected 2xx). See response body above — a 401 means CRON_SECRET is missing or doesn't match between this repo's secret and Vercel's production env var."
            exit 1
          fi
      - name: Check queue depth
        run: |
          url="${{ vars.PRODUCTION_URL || 'https://get-ahead-five.vercel.app' }}/api/cron/queue-alert"
          http_code=$(curl -s -o /tmp/alert-body.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$url")
          echo "GET $url -> HTTP $http_code"
          echo "Response body:"
          cat /tmp/alert-body.txt
          echo
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::queue-alert returned HTTP $http_code (expected 2xx). See response body above — a 401 means CRON_SECRET is missing or doesn't match between this repo's secret and Vercel's production env var."
            exit 1
          fi
