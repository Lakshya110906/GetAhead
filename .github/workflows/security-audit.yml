name: Dependency security audit

# Backs the privacy policy's "regular dependency audits and security
# patches" commitment — weekly on a schedule, plus every PR that touches
# package.json/package-lock.json, since that's exactly when a new
# vulnerable dependency would be introduced.
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high
