name: Accuracy harness

# Runs whenever the prompt, structured-output schema, rubric, model config,
# or the golden set itself changes — those are exactly the changes that can
# silently move grading accuracy without anything else (typecheck, lint,
# unit tests) noticing. answerSheetSchema.ts is watched separately from
# answerSheetGrading.ts: it defines the Gemini response schema (ERROR_TYPES,
# GEMINI_GRADE_RESPONSE_SCHEMA) that constrains what the model can even
# output, and can change accuracy without the prompt TEXT changing at all —
# this workflow previously missed exactly this file.
on:
  pull_request:
    paths:
      - "src/lib/answerSheetGrading.ts"
      - "src/lib/answerSheetSchema.ts"
      - "src/lib/paperValidation.ts"
      - "src/lib/question-agents.ts"
      - "src/lib/evaluationWorker.ts"
      - "scripts/accuracy-harness.ts"
      - "scripts/lib/accuracyMetrics.ts"
      - "scripts/lib/goldenSet.ts"
      - "fixtures/golden-set/**"
      - "accuracy-results/baseline.json"
  push:
    branches: [main]
    paths:
      - "src/lib/answerSheetGrading.ts"
      - "src/lib/answerSheetSchema.ts"
      - "src/lib/paperValidation.ts"
      - "src/lib/question-agents.ts"
      - "src/lib/evaluationWorker.ts"
      - "scripts/accuracy-harness.ts"
      - "scripts/lib/accuracyMetrics.ts"
      - "scripts/lib/goldenSet.ts"
      - "fixtures/golden-set/**"
      - "accuracy-results/baseline.json"
  workflow_dispatch: {}

jobs:
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run accuracy harness against the golden set
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run accuracy

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-report
          path: accuracy-results/latest.json
          if-no-files-found: ignore
